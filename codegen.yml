overwrite: true
schema: "src/graphql/schema.graphql"
documents: null
generates:
  src/generated/graphql.ts:
    plugins:
      - "typescript"
      - "typescript-resolvers"
    config:
      useIndexSignature: true
      contextType: "../../main.ts#MyContext"
      scalars:
        DateTime: Date
      mappers:
        Pet: "./prisma/client.ts#Pet as PetModel"
