overwrite: true
schema: "src/server/graphql/schema.graphql"
documents: null
generates:
  src/generated/graphql.ts:
    plugins:
      - "typescript"
      - "typescript-resolvers"
    config:
      useIndexSignature: true
      contextType: "../server/context.ts#MyContext"
      scalars:
        DateTime: Date
      mappers:
        Pet: "./prisma/client.ts#Pet as PetModel"
        User: "./prisma/client.ts#User as UserModel"
