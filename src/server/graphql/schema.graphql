scalar DateTime

type User {
  id: ID!
  name: String!
  pets: [PetLost!]!
}

type PetLost {
  id: ID!
  name: String!
  contact: String
  color: String
  race: String
  state: String!
  createdAt: DateTime!
  photos: [PhotoPetLost!]!
  userId: String!
  user: User!
}

type PhotoPetLost {
  id: ID!
  petId: String!
  pet: PetLost!
  url: String!
  # embedding NO se expone en GraphQL: es Unsupported(vector) y solo sirve para búsqueda interna
}
input CreateLostPetInput {
  name: String!
  contact: String
  color: String
  race: String
}

input CreateUserInput {
  name: String!
}

type Query {
  pets: [PetLost!]!
  pet(id: ID!): PetLost
  users: [User!]!
  user(id: ID!): User
}

type Mutation {
  createLostPet(input: CreateLostPetInput!): PetLost!
  createLostPet(input: CreateLostPetInput!): PetLost!
  createUser(input: CreateUserInput!): User!
}
