scalar DateTime

type User {
  id: ID!
  name: String!
  pets: [Pet!]!
}

type Pet {
  id: ID!
  name: String!
  species: String!
  age: Int
  createdAt: DateTime!
  user: User
}

input CreatePetInput {
  name: String!
  species: String!
  age: Int
  userId: ID!
}

input CreateUserInput {
  name: String!
}

type Query {
  pets: [Pet!]!
  pet(id: ID!): Pet
  users: [User!]!
  user(id: ID!): User
}

type Mutation {
  createPet(input: CreatePetInput!): Pet!
  createUser(input: CreateUserInput!): User!
}
